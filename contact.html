<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Formulario de contacto">
    <meta name="author" content="Diego Alejandro Sepulveda Perez">
    <title>Contacto - Mi sitio</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body id="inicio">
    <header>
        <h1>mi sitio personal</h1>
        <nav>
            <ul>
                <li><a href="index.html">home</a></li>
                <li><a href="projects.html">proyecto</a></li>
                <li><a href="articles.html">articulos</a></li>
                <li><a href="contact.html">contacto</a></li>
            </ul>
        </nav>
        <button id="theme-toggle" class="btn-theme">🌙 Modo Oscuro</button>
    </header>

    <main>
        <section>
            <h2>Escríbeme</h2>
            <p>¿Tienes alguna pregunta o quieres trabajar conmigo? Llena el formulario.</p>

            <form class="form-contacto">
                <div class="campo">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>
                </div>

                <div class="campo">
                    <label for="asunto">Asunto:</label>
                    <input type="text" id="asunto" name="asunto" placeholder="Asunto del mensaje" required>
                </div>

                <div class="campo">
                    <label for="mensaje">Mensaje:</label>
                    <textarea id="mensaje" name="mensaje" placeholder="Escribe tu mensaje aquí..." required></textarea>
                </div>

                <button type="submit" class="btn btn-inicio">Enviar mensaje</button>
            </form>

            <!-- Botón de WhatsApp -->
            <div class="btn-group" style="margin-top: 20px;">
                <a href="https://wa.me/573000000000" target="_blank" class="btn btn-whatsapp">
                    💬 Escríbeme por WhatsApp
                </a>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Diego Alejandro. todos los derechos reservados.</p>
    </footer>

    <script>
        const themeBtn = document.getElementById('theme-toggle');
        themeBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            themeBtn.textContent = document.body.classList.contains('dark-mode')
                ? '☀️ Modo Claro'
                : '🌙 Modo Oscuro';
        });
    </script>
</body>
</html>
